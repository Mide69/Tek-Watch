name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod, all]
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

# Queue Terraform runs instead of cancelling a process while it owns a state lock.
concurrency:
  group: terraform-state-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_VERSION: '1.7.5'
  AWS_REGION: 'eu-west-2'
  TF_WORKING_DIR: './infrastructure/terraform'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (validate only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  terraform-plan-dev:
    name: Plan (dev)
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.action == 'plan')
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="key=tek-watch/dev/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -var-file="environments/dev.tfvars" \
            -out=tfplan-dev \
            -no-color 2>&1 | tee plan-output.txt

      - name: Comment PR with plan
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.TF_WORKING_DIR }}/plan-output.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan output unavailable. Inspect the failed job logs.';
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (dev): ${{ steps.plan.outcome }}\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}/tfplan-dev
          if-no-files-found: error
          retention-days: 1

  # Manual only, matching staging and prod. Previously this applied on every
  # push to main, so a routine merge silently provisioned a whole second
  # environment — VPC, NAT gateways, ALB, ECS — on top of prod. Run it
  # deliberately via Actions -> Run workflow (environment: dev, action: apply).
  terraform-apply-dev:
    name: Apply (dev) — manual only
    # No `needs:` — matches staging/prod. Depending on terraform-plan-dev would
    # permanently skip this job, since that job only runs on PRs and pushes.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.action == 'apply'
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/dev/terraform.tfstate"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan-dev

  terraform-apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.action == 'apply')
    environment: staging
    env:
      TF_VAR_environment: staging
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/staging/terraform.tfstate"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -var-file="environments/staging.tfvars" \
            -auto-approve

  terraform-apply-prod:
    name: Apply (prod) — manual only
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply'
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Lives in a gitignored *.auto.tfvars locally because this repo is
      # public. Without it here the variable is empty in CI, the subscription
      # resource counts to zero, and the apply reports Success having quietly
      # left the ops alerts topic with no subscriber at all.
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/prod/terraform.tfstate"

      - name: Terraform Plan (prod — review before apply)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var-file="environments/prod.tfvars" -out=tfplan-prod

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan-prod

  # Destruction is manual and scoped to one environment per run. The remote
  # state bucket and lock table are intentionally kept so each destroy can
  # complete and its state history remains available.
  terraform-destroy-dev:
    name: Destroy (dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.action == 'destroy'
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_DEV }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/dev/terraform.tfstate"
      - name: Destroy dev infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/dev.tfvars" -auto-approve

  terraform-destroy-staging:
    name: Destroy (staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'destroy'
    environment: staging
    env:
      TF_VAR_environment: staging
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_STAGING }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/staging/terraform.tfstate"
      - name: Destroy staging infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/staging.tfvars" -auto-approve

  terraform-destroy-prod:
    name: Destroy (prod)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.action == 'destroy'
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_PROD }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/prod/terraform.tfstate"
      - name: Destroy prod infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/prod.tfvars" -auto-approve

  # Full TekWatch teardown: app environments are destroyed in order, followed
  # by the repo-scoped admin role. The shared account OIDC provider and remote
  # state backend are intentionally retained.
  terraform-destroy-all-dev:
    name: Destroy all — dev
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'all' && inputs.action == 'destroy'
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_DEV }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/dev/terraform.tfstate"
      - name: Destroy dev infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/dev.tfvars" -auto-approve

  terraform-destroy-all-staging:
    name: Destroy all — staging
    runs-on: ubuntu-latest
    needs: terraform-destroy-all-dev
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'all' && inputs.action == 'destroy'
    environment: staging
    env:
      TF_VAR_environment: staging
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_STAGING }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/staging/terraform.tfstate"
      - name: Destroy staging infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/staging.tfvars" -auto-approve

  terraform-destroy-all-prod:
    name: Destroy all — prod
    runs-on: ubuntu-latest
    needs: terraform-destroy-all-staging
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'all' && inputs.action == 'destroy'
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN_PROD }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="key=tek-watch/prod/terraform.tfstate"
      - name: Empty TekWatch production data before destroy
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile

          def aws(args, allow_missing=False):
              result = subprocess.run(
                  ["aws", *args, "--output", "json"],
                  text=True, capture_output=True
              )
              if result.returncode:
                  if allow_missing and (
                      "NotFound" in result.stderr
                      or "Not Found" in result.stderr
                      or "NoSuchBucket" in result.stderr
                      or "404" in result.stderr
                  ):
                      return None
                  raise RuntimeError(result.stderr.strip() or "AWS CLI command failed")
              return json.loads(result.stdout or "{}")

          def delete_batches(args_prefix, objects):
              for offset in range(0, len(objects), 100):
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".json") as payload:
                      json.dump(objects[offset:offset + 100], payload)
                      payload.flush()
                      aws([*args_prefix, "--image-ids" if "ecr" in args_prefix[0] else "--delete", f"file://{payload.name}"])

          # Remove every current and noncurrent version, plus delete markers.
          for bucket in (
              "tek-watch-prod-uploads",
              "tek-watch-prod-admin",
              "tek-watch-prod-dashboard",
          ):
              head = subprocess.run(
                  ["aws", "s3api", "head-bucket", "--bucket", bucket],
                  text=True, capture_output=True
              )
              if head.returncode:
                  if any(message in head.stderr for message in ("NotFound", "Not Found", "NoSuchBucket", "404")):
                      continue
                  raise RuntimeError(head.stderr.strip() or f"Could not inspect {bucket}")
              listing = aws(["s3api", "list-object-versions", "--bucket", bucket])
              versions = [
                  {"Key": item["Key"], "VersionId": item.get("VersionId")}
                  for item in listing.get("Versions", []) + listing.get("DeleteMarkers", [])
              ]
              for offset in range(0, len(versions), 1000):
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".json") as payload:
                      json.dump({"Objects": versions[offset:offset + 1000], "Quiet": True}, payload)
                      payload.flush()
                      aws(["s3api", "delete-objects", "--bucket", bucket, "--delete", f"file://{payload.name}"])

          # Remove image manifests from the three TekWatch private ECR repos.
          for repository in ("tek-watch-agent", "tek-watch-api", "tek-watch-ingest-consumer"):
              repo = aws(
                  ["ecr", "describe-repositories", "--region", "eu-west-2", "--repository-names", repository],
                  allow_missing=True,
              )
              if repo is None:
                  continue
              images = aws([
                  "ecr", "list-images", "--region", "eu-west-2",
                  "--repository-name", repository,
              ]).get("imageIds", [])
              for offset in range(0, len(images), 100):
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".json") as payload:
                      json.dump(images[offset:offset + 100], payload)
                      payload.flush()
                      aws([
                          "ecr", "batch-delete-image", "--region", "eu-west-2",
                          "--repository-name", repository, "--image-ids", f"file://{payload.name}",
                      ])

          # ECR Public is served from us-east-1 and supports digest-based deletion.
          public_repo = aws([
              "ecr-public", "describe-repositories", "--region", "us-east-1",
              "--repository-names", "tek-watch-agent",
          ], allow_missing=True)
          if public_repo is not None:
              images = aws([
                  "ecr-public", "describe-images", "--region", "us-east-1",
                  "--repository-name", "tek-watch-agent",
              ]).get("imageDetails", [])
              digests = [
                  {"imageDigest": image["imageDigest"]}
                  for image in images if image.get("imageDigest")
              ]
              for offset in range(0, len(digests), 100):
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".json") as payload:
                      json.dump(digests[offset:offset + 100], payload)
                      payload.flush()
                      aws([
                          "ecr-public", "batch-delete-image", "--region", "us-east-1",
                          "--repository-name", "tek-watch-agent", "--image-ids", f"file://{payload.name}",
                      ])
          PY

      - name: Destroy prod infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -lock-timeout=5m -var-file="environments/prod.tfvars" -auto-approve

  terraform-destroy-all-bootstrap-role:
    name: Remove TekWatch GitHub admin role
    runs-on: ubuntu-latest
    needs: terraform-destroy-all-prod
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'all' && inputs.action == 'destroy'
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: ./infrastructure/terraform-bootstrap
        run: terraform init
      - name: Remove repo-scoped admin role, retain shared OIDC provider
        working-directory: ./infrastructure/terraform-bootstrap
        run: terraform destroy -input=false -lock-timeout=5m -target=aws_iam_role_policy_attachment.github_actions_admin -target=aws_iam_role.github_actions -auto-approve

