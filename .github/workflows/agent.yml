name: Agent CI/CD

# CD is gated behind the ENABLE_CD repository variable and is OFF by default.
# Two things must be fixed before these jobs can succeed:
#   1. ECR_REPOSITORY below names e.g. "tek-watch-api", but terraform creates
#      per-environment repos ("tek-watch-prod-api"). The names do not exist.
#   2. build-and-push declares no `environment:`, so it cannot read AWS_ROLE_ARN
#      while that is stored as a dev *environment* secret.
# Until then these jobs would fail on every push and drown out real signal.
# To re-enable: set repository variable ENABLE_CD=true (Settings -> Secrets and
# variables -> Actions -> Variables), after fixing 1 and 2 above.

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
  workflow_dispatch:


env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: tek-watch-agent

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./agent
        run: pytest --cov=. --cov-report=term-missing

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Also runs on workflow_dispatch. deploy-prod needs this job but only
    # fires on dispatch, so gating this on push alone made the two mutually
    # exclusive — a manual prod deploy skipped its own dependency and could
    # therefore never run at all.
    if: vars.ENABLE_CD == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        working-directory: ./agent
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Tag with version on release
        if: vars.ENABLE_CD == 'true' && (startsWith(github.ref, 'refs/tags/v'))
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

  # The agent is a scheduled Fargate task (EventBridge -> ecs:RunTask), not a
  # long-running ECS service — agent/main.py runs its collectors once and
  # exits by design. The task definition's container image is the mutable
  # ":latest" tag (see infrastructure/terraform/modules/ecs/main.tf), so the
  # *next scheduled run* automatically picks up whatever build-and-push just
  # pushed — there is nothing to "deploy" on the ECS side. These jobs just
  # trigger one immediate run for fast feedback instead of waiting for the
  # next tick, reusing the network config Terraform already attached to the
  # EventBridge target (no extra secrets needed for subnets/security groups).
  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Separate gate: no dev environment is provisioned, so this would fail on
    # every push to main. Set ENABLE_DEV_DEPLOY=true only once terraform has
    # actually created one.
    if: vars.ENABLE_DEV_DEPLOY == 'true' && (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: dev
    env:
      ECS_CLUSTER: tek-watch-dev
      TASK_FAMILY: tek-watch-dev-agent
      SCHEDULE_RULE: tek-watch-dev-agent-schedule
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger immediate agent run (verification)
        run: |
          NET_CONFIG=$(aws events list-targets-by-rule \
            --rule "$SCHEDULE_RULE" \
            --query 'Targets[0].EcsParameters.NetworkConfiguration' \
            --output json)
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NET_CONFIG"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Separate gate: staging.tfvars exists but has never been applied.
    if: vars.ENABLE_STAGING_DEPLOY == 'true' && (startsWith(github.ref, 'refs/tags/v'))
    environment: staging
    env:
      ECS_CLUSTER: tek-watch-staging
      TASK_FAMILY: tek-watch-staging-agent
      SCHEDULE_RULE: tek-watch-staging-agent-schedule
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger immediate agent run (verification)
        run: |
          NET_CONFIG=$(aws events list-targets-by-rule \
            --rule "$SCHEDULE_RULE" \
            --query 'Targets[0].EcsParameters.NetworkConfiguration' \
            --output json)
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NET_CONFIG"

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_CD == 'true' && (github.event_name == 'workflow_dispatch')
    environment: prod
    env:
      ECS_CLUSTER: tek-watch-prod
      TASK_FAMILY: tek-watch-prod-agent
      SCHEDULE_RULE: tek-watch-prod-agent-schedule
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger immediate agent run (verification)
        run: |
          NET_CONFIG=$(aws events list-targets-by-rule \
            --rule "$SCHEDULE_RULE" \
            --query 'Targets[0].EcsParameters.NetworkConfiguration' \
            --output json)
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NET_CONFIG"
