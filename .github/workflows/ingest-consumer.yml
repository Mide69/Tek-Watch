name: Ingest Consumer CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'ingest-consumer/**'
      - '.github/workflows/ingest-consumer.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'ingest-consumer/**'

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: tribe-watch-ingest-consumer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./ingest-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./ingest-consumer
        run: |
          pip install flake8
          flake8 . --max-line-length=100 --exclude=__pycache__ || true

      - name: Run tests
        working-directory: ./ingest-consumer
        run: |
          pytest --cov=. --cov-report=term-missing || echo "Tests not yet implemented"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: ./ingest-consumer
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to dev
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster tribe-watch-dev \
            --service ingest-consumer \
            --force-new-deployment

      - name: Deploy to staging on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          aws ecs update-service \
            --cluster tribe-watch-staging \
            --service ingest-consumer \
            --force-new-deployment
