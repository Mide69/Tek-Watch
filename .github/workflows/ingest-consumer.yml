name: Ingest Consumer CI/CD

# CD is gated behind the ENABLE_CD repository variable and is OFF by default.
# Two things must be fixed before these jobs can succeed:
#   1. ECR_REPOSITORY below names e.g. "tek-watch-api", but terraform creates
#      per-environment repos ("tek-watch-prod-api"). The names do not exist.
#   2. build-and-push declares no `environment:`, so it cannot read AWS_ROLE_ARN
#      while that is stored as a dev *environment* secret.
# Until then these jobs would fail on every push and drown out real signal.
# To re-enable: set repository variable ENABLE_CD=true (Settings -> Secrets and
# variables -> Actions -> Variables), after fixing 1 and 2 above.

on:
  push:
    branches: [main]
    paths:
      - 'ingest-consumer/**'
      - '.github/workflows/ingest-consumer.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'ingest-consumer/**'
  workflow_dispatch:


env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: tek-watch-ingest-consumer

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./ingest-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        working-directory: ./ingest-consumer
        run: flake8 . --max-line-length=100 --exclude=__pycache__

      - name: Run tests
        working-directory: ./ingest-consumer
        run: pytest --cov=. --cov-report=term-missing

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: vars.ENABLE_CD == 'true' && (github.event_name == 'push')
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        working-directory: ./ingest-consumer
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Tag with version on release
        if: vars.ENABLE_CD == 'true' && (startsWith(github.ref, 'refs/tags/v'))
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_CD == 'true' && (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: dev
    env:
      # The name_prefix is on the CLUSTER, not the service — the ECS
      # services are plain "api" / "ingest-consumer". These were set to
      # tek-watch-<env>-<service>, which no service has ever been called,
      # so every deploy would have failed with ServiceNotFoundException.
      ECS_CLUSTER: tek-watch-dev
      ECS_SERVICE: ingest-consumer
      TASK_FAMILY: tek-watch-dev-ingest-consumer
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ env.TASK_FAMILY }}
          container-name: ingest-consumer
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy to ECS (dev)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_CD == 'true' && (startsWith(github.ref, 'refs/tags/v'))
    environment: staging
    env:
      ECS_CLUSTER: tek-watch-staging
      ECS_SERVICE: ingest-consumer
      TASK_FAMILY: tek-watch-staging-ingest-consumer
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ env.TASK_FAMILY }}
          container-name: ingest-consumer
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy to ECS (staging)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_CD == 'true' && (github.event_name == 'workflow_dispatch')
    environment: prod
    env:
      ECS_CLUSTER: tek-watch-prod
      ECS_SERVICE: ingest-consumer
      TASK_FAMILY: tek-watch-prod-ingest-consumer
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: ${{ env.TASK_FAMILY }}
          container-name: ingest-consumer
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Deploy to ECS (prod)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
