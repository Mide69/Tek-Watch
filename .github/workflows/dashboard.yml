name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'

defaults:
  run:
    working-directory: ./dashboard

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.DASHBOARD_API_BASE_URL || 'https://api.tribewatch.io' }}
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/.next
          retention-days: 1

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for dev
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-dev.tribewatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID_DEV }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID_DEV }}
        run: npm run build

      - name: Deploy to S3 + CloudFront (dev)
        env:
          S3_BUCKET: ${{ secrets.DASHBOARD_S3_BUCKET_DEV }}
          CF_DISTRIBUTION: ${{ secrets.DASHBOARD_CF_DISTRIBUTION_DEV }}
        run: |
          aws s3 sync .next/static s3://$S3_BUCKET/_next/static --delete
          aws s3 sync public s3://$S3_BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION --paths "/*"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build for staging
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-staging.tribewatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID_STAGING }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID_STAGING }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3 + CloudFront (staging)
        env:
          S3_BUCKET: ${{ secrets.DASHBOARD_S3_BUCKET_STAGING }}
          CF_DISTRIBUTION: ${{ secrets.DASHBOARD_CF_DISTRIBUTION_STAGING }}
        run: |
          aws s3 sync .next/static s3://$S3_BUCKET/_next/static --delete
          aws s3 sync public s3://$S3_BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION --paths "/*"
