name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:


defaults:
  run:
    working-directory: ./dashboard

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

  build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PR / branch validation build — uses placeholder Cognito values so
      # the app runs in demo mode. Not deployed anywhere.
      - name: Build (validation)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.tekwatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: eu-west-2_PLACEHOLDER
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/out
          retention-days: 1

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for dev
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-dev.tekwatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID_DEV }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID_DEV }}
        run: npm run build

      # Two-pass sync: immutable cache for assets, no-cache for HTML
      - name: Deploy to S3 + CloudFront (dev)
        env:
          S3_BUCKET: ${{ secrets.DASHBOARD_S3_BUCKET_DEV }}
          CF_DISTRIBUTION: ${{ secrets.DASHBOARD_CF_DISTRIBUTION_DEV }}
        run: |
          aws s3 sync out/ s3://$S3_BUCKET --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync out/ s3://$S3_BUCKET \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" --include "*.html"
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION --paths "/*"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build for staging
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-staging.tekwatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID_STAGING }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID_STAGING }}
        run: |
          npm ci
          npm run build

      - name: Deploy to S3 + CloudFront (staging)
        env:
          S3_BUCKET: ${{ secrets.DASHBOARD_S3_BUCKET_STAGING }}
          CF_DISTRIBUTION: ${{ secrets.DASHBOARD_CF_DISTRIBUTION_STAGING }}
        run: |
          aws s3 sync out/ s3://$S3_BUCKET --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync out/ s3://$S3_BUCKET \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" --include "*.html"
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION --paths "/*"

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build for prod
        env:
          NEXT_PUBLIC_API_BASE_URL: https://app.tekwatch.io
          NEXT_PUBLIC_COGNITO_REGION: eu-west-2
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_CUSTOMER_USER_POOL_ID_PROD }}
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_CUSTOMER_APP_CLIENT_ID_PROD }}
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy to S3 + CloudFront (prod)
        env:
          S3_BUCKET: ${{ secrets.DASHBOARD_S3_BUCKET_PROD }}
          CF_DISTRIBUTION: ${{ secrets.DASHBOARD_CF_DISTRIBUTION_PROD }}
        working-directory: ./dashboard
        run: |
          aws s3 sync out/ s3://$S3_BUCKET --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync out/ s3://$S3_BUCKET \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" --include "*.html"
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION --paths "/*"
