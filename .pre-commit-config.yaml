repos:
  # ─── Python (API) ────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^api/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - pydantic>=2.7
          - fastapi>=0.111

  # ─── TypeScript / Next.js (dashboard + admin-portal) ─────────────────────────
  - repo: local
    hooks:
      - id: eslint-dashboard
        name: ESLint (dashboard)
        language: system
        entry: bash -c 'cd dashboard && npx eslint --max-warnings=0 $@' --
        types_or: [ts, tsx]
        files: ^dashboard/src/
        pass_filenames: true

      - id: tsc-dashboard
        name: TypeScript check (dashboard)
        language: system
        entry: bash -c 'cd dashboard && npx tsc --noEmit'
        types_or: [ts, tsx]
        files: ^dashboard/src/
        pass_filenames: false

  # ─── General ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
